name: Deploy to Staging

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref_name }} # Asigură-te că faci checkout la branch-ul curent

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Staging Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.STAGING_PATH }} &&
            git init &&
            git remote add origin https://github.com/alexnegoita88/spectrumstudio.ro.git || true &&
            git fetch origin &&
            git checkout ${{ github.ref_name }} &&
            git pull origin ${{ github.ref_name }} &&
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev &&
            php artisan optimize:clear &&
            php artisan migrate --force
          "
