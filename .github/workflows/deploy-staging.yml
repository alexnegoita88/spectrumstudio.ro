name: Deploy to Staging (dev.spectrumstudio.ro)

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and Build on Staging Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navighează la folderul de staging
            cd ${{ secrets.STAGING_PATH }}
            
            # --- Pasii de Sincronizare GIT ---
            git fetch origin --prune
            git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # --- Pasii de Build (direct pe server) ---
            
            # Activează NVM pentru a folosi Node.js și NPM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Rulează comenzile
            /usr/local/bin/ea-php82 /usr/local/bin/composer install --no-dev --optimize-autoloader
            npm install
            npm run build
            /usr/local/bin/ea-php82 artisan optimize:clear
            /usr/local/bin/ea-php82 artisan migrate --force
            /usr/local/bin/ea-php82 artisan storage:link || true