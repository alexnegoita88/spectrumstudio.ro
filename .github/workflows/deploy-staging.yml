name: Deploy to Staging (dev.spectrumstudio.ro)

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Staging Server
        run: |
          # Afișează numele branch-ului care a declanșat acțiunea
          echo "Deploying branch: ${{ github.ref_name }}"
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.STAGING_PATH }} &&
            
            # --- Pasii de Sincronizare GIT ---
            git fetch origin --prune &&
            
            # Comută pe branch-ul corespunzător. Îl creează local dacă nu există.
            git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }} &&
            
            # Actualizează branch-ul local cu cea mai recentă versiune de pe GitHub
            git reset --hard origin/${{ github.ref_name }} &&
            
            # Curăță fișierele ne-urmărite, dar protejează .env
            git clean -df -e .env &&
            
            # --- Pasii Specifici Proiectului ---
            /usr/local/bin/ea-php82 /usr/local/bin/composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev &&
            /usr/local/bin/ea-php82 artisan optimize:clear &&
            /usr/local/bin/ea-php82 artisan migrate --force
          "