name: Deploy to Staging (dev.spectrumstudio.ro)

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref_name }} # Asigură-te că faci checkout la branch-ul curent

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Staging Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.STAGING_PATH }} &&
            
            # --- Pasii de Sincronizare GIT (varianta robusta) ---
            git init || true &&
            git remote set-url origin git@github.com:${{ github.repository }}.git || git remote add origin git@github.com:${{ github.repository }}.git &&
            git fetch origin &&
            git reset --hard origin/${{ github.ref_name }} &&
            git clean -dfx &&
            
            # --- Pasii Specifici Proiectului (cu caile corecte) ---
            /usr/local/bin/ea-php82 /usr/local/bin/composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev &&
            /usr/local/bin/ea-php82 artisan optimize:clear &&
            /usr/local/bin/ea-php82 artisan migrate --force
          "