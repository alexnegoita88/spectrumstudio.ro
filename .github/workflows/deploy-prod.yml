name: Deploy to Production (spectrumstudio.ro)

on:
  push:
    branches:
      - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "--- Starting Deployment to Production ---"
            
            # Navighează la folderul de productie
            cd ${{ secrets.PRODUCTION_PATH }}
            
            # --- Actualizează Codul ---
            git checkout main
            git pull origin main
            
            # --- Rulează Comenzile de Build pe Server ---
            
            # Activează NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            echo "Installing dependencies and building assets..."
            /usr/local/bin/ea-php82 /usr/local/bin/composer install --no-dev --optimize-autoloader
            npm install
            npm run build
            
            echo "Running final Laravel commands..."
            /usr/local/bin/ea-php82 artisan optimize
            /usr/local/bin/ea-php82 artisan migrate --force